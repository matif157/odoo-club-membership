name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0
      options: --user root

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Link module into the addons path
        run: |
          mkdir -p /mnt/extra-addons
          ln -sfn "$GITHUB_WORKSPACE/club_membership" /mnt/extra-addons/club_membership

      - name: Run module tests
        run: |
          odoo -d testdb \
            --db_host=db --db_user=odoo --db_password=odoo \
            -i club_membership \
            --test-tags /club_membership \
            --stop-after-init \
            --without-demo=all
